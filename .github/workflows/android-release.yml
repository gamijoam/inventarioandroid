name: Android APK

# - Tag v* (ej. v0.2.0)          -> Release estable + latest.json (lo usa el actualizador de la app)
# - Push a la rama principal       -> pre-release de prueba "build-N" (el actualizador NO lo ofrece)
# - Manual (Actions > Run workflow) -> pre-release de prueba "build-N"
on:
  push:
    tags: ["v*"]
    branches: [main, ccr-43e95da0-ca2dyh]
    paths: ["app/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:

permissions:
  contents: write # necesario para crear el Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      NDK_VERSION: "27.2.12479018"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      # Estable (tag v1.2.3): versión 1.2.3.
      # Prueba (push/manual):  versión <tauri.conf.json>-build.N (semver menor que la estable).
      # versionCode = major*1000000 + minor*1000 + patch: sube en cada versión estable;
      # los builds de prueba comparten el de su versión base, así que la estable se instala encima.
      - name: Calcular versión
        run: |
          set -euo pipefail
          BASE=$(jq -r .version src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; TAG="$GITHUB_REF_NAME"; STABLE=true
          else
            VERSION="${BASE}-build.${GITHUB_RUN_NUMBER}"; TAG="build-${GITHUB_RUN_NUMBER}"; STABLE=false
          fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versión inválida '$VERSION'. Usa tags como v1.2.3"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          jq --arg v "$VERSION" --argjson c "$CODE" '.version = $v | .bundle.android.versionCode = $c' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          { echo "VERSION=$VERSION"; echo "TAG=$TAG"; echo "STABLE=$STABLE"; } >> "$GITHUB_ENV"
          echo "Versión $VERSION · versionCode $CODE · estable=$STABLE"

      - name: Verificar llave de firma (versiones estables)
        if: env.STABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Las versiones estables deben firmarse con la llave permanente. Configura los secretos ANDROID_KEYSTORE_*."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # El runner ubuntu-24.04 ya trae el SDK de Android y un NDK reciente.
      - name: Configurar Android SDK/NDK
        working-directory: .
        run: |
          if [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -d "$ANDROID_NDK_LATEST_HOME" ]]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
            NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK: $NDK"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci

      - name: Pruebas de Rust
        working-directory: app/src-tauri
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev > /dev/null
          cargo test --quiet

      - name: Generar proyecto Android
        run: npm run tauri android init -- --ci

      # APK universal para teléfonos ARM de 64 y 32 bits (prácticamente todos los Android reales).
      - name: Compilar APK
        run: npm run tauri android build -- --apk --target aarch64 --target armv7 --ci

      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          echo "APK sin firmar: $UNSIGNED"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEY_NOTE=Firmada con la llave de release del proyecto." >> "$GITHUB_ENV"
          else
            # Solo builds de prueba: llave temporal (habrá que desinstalar para cambiar de build).
            KEYSTORE_PASSWORD=temporal123; KEY_ALIAS=temporal; KEY_PASSWORD=temporal123
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Inventario, O=Inventario, C=VE"
            echo "::warning::No hay secretos ANDROID_KEYSTORE_*: se usó una llave temporal."
            echo "KEY_NOTE=⚠️ Firmada con una llave temporal: para instalarla, desinstala la versión anterior." >> "$GITHUB_ENV"
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          NAME="Inventario-${VERSION}.apk"
          OUT="$GITHUB_WORKSPACE/$NAME"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | grep -i "SHA-256 digest" | head -1
          rm -f "$RUNNER_TEMP/release.jks"
          { echo "APK=$OUT"; echo "APK_NAME=$NAME"; } >> "$GITHUB_ENV"

      # Notas: mensaje del tag anotado, o el texto del Release si lo creaste a mano en GitHub.
      - name: Preparar notas y latest.json
        run: |
          set -euo pipefail
          NOTAS=""
          if [[ "$STABLE" == "true" ]]; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
            if [[ "$(git cat-file -t "$TAG" 2>/dev/null)" == "tag" ]]; then
              NOTAS=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/-----BEGIN PGP/,$d')
            fi
            if [[ -z "${NOTAS// }" ]]; then
              NOTAS=$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)
            fi
          fi
          [[ -z "${NOTAS// }" ]] && NOTAS="Versión ${VERSION}"
          printf '%s\n' "$NOTAS" > "$RUNNER_TEMP/notas.md"

          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          MINIMA=$(jq -r '.version_minima // "0.0.0"' actualizaciones.json)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          jq -n --arg version "$VERSION" --arg url "$URL" --arg sha256 "$SHA" \
                --rawfile notas "$RUNNER_TEMP/notas.md" --arg minima "$MINIMA" \
                --arg fecha "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{version: $version, url: $url, sha256: $sha256, notas: ($notas | rtrimstr("\n")),
                  version_minima: $minima, fecha: $fecha}' > "$GITHUB_WORKSPACE/latest.json"
          cat "$GITHUB_WORKSPACE/latest.json"

          {
            printf '%s\n\n' "$NOTAS"
            echo "---"
            echo "**Instalar:** descarga \`${APK_NAME}\` en tu teléfono y ábrela (permite \"instalar apps de origen desconocido\" si Android lo pide)."
            echo "Si ya tienes la app con la misma firma, también puedes actualizar desde *Ajustes → Buscar actualizaciones*."
            echo
            echo "SHA-256: \`${SHA}\`"
            echo
            echo "${KEY_NOTE}"
          } > "$RUNNER_TEMP/body.md"
          echo "BODY_FILE=$RUNNER_TEMP/body.md" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: Inventario-${{ env.VERSION }}-apk
          path: ${{ env.APK }}

      - name: Publicar Release estable
        if: env.STABLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Inventario ${{ env.VERSION }}
          prerelease: false
          make_latest: true
          body_path: ${{ env.BODY_FILE }}
          files: |
            ${{ env.APK }}
            latest.json

      - name: Publicar build de prueba
        if: env.STABLE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Inventario ${{ env.VERSION }} (prueba)
          prerelease: true
          make_latest: false
          body_path: ${{ env.BODY_FILE }}
          files: ${{ env.APK }}
