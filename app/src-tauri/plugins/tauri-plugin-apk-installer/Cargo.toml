[package]
name = "tauri-plugin-apk-installer"
version = "0.1.0"
authors = [ "Inventario" ]
description = "Abre el instalador de Android para actualizar la app"
edition = "2021"

exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-apk-installer"

[dependencies]
tauri = { version = "2.12.6" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.3", features = ["build"] }
